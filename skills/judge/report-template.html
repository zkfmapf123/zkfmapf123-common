<title>{{TITLE}}</title>
<style>
:root{--bg:#f5f6f4;--surface:#fff;--ink:#1c2422;--muted:#5d6a66;--line:#d8ddda;--accent:#1f7a6b;--soft:#e4f0ec;--warn:#9a6a12;--warn-soft:#f6ecd4;--bannerbg:#eef1ef}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131917;--surface:#1b2320;--ink:#e6ebe8;--muted:#9aa8a3;--line:#2c3733;--accent:#5fbfa9;--soft:#1f302b;--warn:#e2b45a;--warn-soft:#332a14;--bannerbg:#1a211e}}
:root[data-theme="dark"]{--bg:#131917;--surface:#1b2320;--ink:#e6ebe8;--muted:#9aa8a3;--line:#2c3733;--accent:#5fbfa9;--soft:#1f302b;--warn:#e2b45a;--warn-soft:#332a14;--bannerbg:#1a211e}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.65;padding-inline:20px;padding-block:40px 80px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:clamp(24px,4vw,32px);line-height:1.25;font-weight:600;margin:8px 0 16px;text-wrap:balance}
h2{font-size:20px;font-weight:600;margin:40px 0 14px;padding-top:16px;border-top:1px solid var(--line)}
h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
p{margin:0 0 10px}ul,ol{margin:0 0 10px;padding-left:20px}li{margin-bottom:5px}
code{font-family:ui-monospace,monospace;font-size:.9em;background:var(--soft);padding:1px 5px;border-radius:3px}
pre{background:var(--surface);border:1px solid var(--line);padding:12px 14px;overflow-x:auto;font-size:13px}
pre code{background:none;padding:0}
blockquote{background:var(--bannerbg);border-left:3px solid var(--accent);padding:12px 16px;margin:16px 0;font-size:14px;color:var(--muted)}
blockquote strong{color:var(--ink)}
.member{background:var(--surface);border:1px solid var(--line);padding:16px 20px;margin:16px 0;font-size:14px}
.member h2{border:0;margin:0 0 8px;padding:0;font-size:17px}
.synth h2{color:var(--accent)}
footer{margin-top:48px;font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace}
</style>
<div class="wrap" id="out"></div>
<script id="md" type="text/markdown">{{MARKDOWN}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
var md=document.getElementById('md').textContent.replace(/<\\\/script/g,'</script');
var html=marked.parse(md);
// Wrap each "## 🗳️ …" section in a card, and everything from "## Synthesis" on in .synth
var out=document.getElementById('out');out.innerHTML=html;
var kids=[].slice.call(out.children),wrap=null,mode='';
kids.forEach(function(el){
  if(el.tagName==='H2'){
    var t=el.textContent;
    if(t.indexOf('🗳️')===0){wrap=document.createElement('section');wrap.className='member';out.insertBefore(wrap,el);mode='member';}
    else if(/^Synthesis|^합성/.test(t)){wrap=document.createElement('section');wrap.className='synth';out.insertBefore(wrap,el);mode='synth';}
    else if(mode==='member'){wrap=null;mode='';}
  }
  if(wrap)wrap.appendChild(el);
});
var f=document.createElement('footer');f.textContent='judge · '+new Date().toISOString().slice(0,10);out.appendChild(f);
</script>
